<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>AURA LIVE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />

  <style>
    /* ─────────────────────────────────────
       RESET & BASE
    ───────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #080c12;
      --panel:    rgba(8, 12, 20, 0.88);
      --border:   rgba(255, 255, 255, 0.10);
      --accent:   #ff2d55;
      --cyan:     #00e0ff;
      --green:    #30d158;
      --txt:      #f2f5fc;
      --txt-mid:  #8b95a8;
      --txt-dim:  #4a5568;
      --radius:   16px;
    }

    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      color: var(--txt);
      font-family: 'Inter', system-ui, sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* ─────────────────────────────────────
       FULLSCREEN CANVAS LAYER
       DeepAR injects a <canvas> into #deepar-root.
       We force it to fill the viewport.
    ───────────────────────────────────── */
    #deepar-root {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      z-index: 0;
    }
    /* Target the DeepAR-injected canvas directly */
    #deepar-root canvas {
      position: absolute !important;
      top: 0 !important; left: 0 !important;
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
      display: block !important;
    }

    /* ─────────────────────────────────────
       OVERLAY GRADIENTS (non-interactive)
    ───────────────────────────────────── */
    .grad-top {
      position: fixed; inset: 0; bottom: auto;
      height: 180px;
      background: linear-gradient(to bottom, rgba(0,0,0,.65), transparent);
      z-index: 2; pointer-events: none;
    }
    .grad-bottom {
      position: fixed; inset: auto 0 0;
      height: 340px;
      background: linear-gradient(to top, rgba(5,8,15,.96) 0%, rgba(5,8,15,.7) 60%, transparent 100%);
      z-index: 2; pointer-events: none;
    }

    /* ─────────────────────────────────────
       INIT / LOADING OVERLAY
       Shown until DeepAR is fully ready.
    ───────────────────────────────────── */
    #init-overlay {
      position: fixed; inset: 0;
      z-index: 100;
      background: var(--bg);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 20px; padding: 40px;
      text-align: center;
      transition: opacity 0.5s;
    }
    #init-overlay.fade-out { opacity: 0; pointer-events: none; }
    #init-overlay.hidden   { display: none; }

    .brand-name {
      font-size: 28px; font-weight: 700;
      letter-spacing: 0.14em; text-transform: uppercase;
      background: linear-gradient(90deg, #fff 0%, var(--cyan) 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Animated spinner */
    .spinner {
      width: 52px; height: 52px;
      border: 3px solid rgba(0, 224, 255, 0.15);
      border-top-color: var(--cyan);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Status string */
    #status-text {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px; color: var(--txt-mid);
      letter-spacing: 0.10em; text-transform: uppercase;
      min-height: 18px;
    }

    /* Progress bar */
    .progress-track {
      width: 220px; height: 3px;
      background: rgba(255,255,255,0.08);
      border-radius: 3px; overflow: hidden;
    }
    .progress-fill {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, var(--cyan), #007aff);
      border-radius: 3px;
      transition: width 0.4s ease;
    }

    /* Grant camera button (shown only on permission error) */
    #grant-btn {
      display: none;
      padding: 13px 32px; border: none; border-radius: 100px;
      background: linear-gradient(135deg, var(--accent), #c01234);
      color: #fff; font-family: 'Inter', sans-serif;
      font-size: 14px; font-weight: 600;
      cursor: pointer; margin-top: 8px;
      box-shadow: 0 0 28px rgba(255,45,85,.4);
      transition: transform .15s;
    }
    #grant-btn:active { transform: scale(.97); }

    /* ─────────────────────────────────────
       TOP BAR  (live badge + timer)
    ───────────────────────────────────── */
    #top-bar {
      position: fixed;
      top: max(14px, env(safe-area-inset-top));
      left: 0; right: 0;
      z-index: 10;
      display: flex; align-items: center;
      justify-content: space-between;
      padding: 0 18px;
    }

    .app-brand {
      font-size: 15px; font-weight: 700;
      letter-spacing: 0.14em; text-transform: uppercase;
      background: linear-gradient(90deg, #fff, var(--cyan));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* LIVE badge */
    #live-badge {
      display: flex; align-items: center; gap: 6px;
      background: var(--accent);
      padding: 4px 12px; border-radius: 100px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px; font-weight: 600;
      letter-spacing: 0.08em; text-transform: uppercase;
      opacity: 0; transition: opacity 0.3s;
    }
    #live-badge.visible { opacity: 1; }
    #live-badge::before {
      content: '';
      width: 6px; height: 6px; border-radius: 50%;
      background: #fff;
      animation: blink 1.1s ease-in-out infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }

    #stream-timer {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px; font-weight: 600;
      color: var(--cyan); letter-spacing: 0.12em;
      opacity: 0; transition: opacity 0.3s;
    }
    #stream-timer.visible { opacity: 1; }

    /* ─────────────────────────────────────
       RUNTIME STATUS PILL (top-center)
       Shows "Ready", "Applying filter…" etc.
    ───────────────────────────────────── */
    #runtime-status {
      position: fixed;
      top: max(60px, calc(env(safe-area-inset-top) + 46px));
      left: 50%; transform: translateX(-50%);
      z-index: 10;
      background: var(--panel);
      border: 1px solid var(--border);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      padding: 6px 16px; border-radius: 100px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px; color: var(--txt-mid);
      letter-spacing: 0.10em; text-transform: uppercase;
      white-space: nowrap;
      transition: opacity 0.3s;
    }

    /* ─────────────────────────────────────
       BOTTOM CONTROL PANEL
    ───────────────────────────────────── */
    #control-panel {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 10;
      padding: 0 20px max(28px, env(safe-area-inset-bottom));
    }

    /* RTMP info row */
    #rtmp-info {
      display: none; /* shown when live */
      margin-bottom: 14px;
      background: rgba(0,0,0,.55);
      border: 1px solid var(--border);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-radius: 12px; padding: 10px 14px;
      align-items: center; gap: 10px;
    }
    #rtmp-info.visible { display: flex; }
    .rtmp-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px; color: var(--txt-dim);
      text-transform: uppercase; letter-spacing: 0.10em;
      flex-shrink: 0;
    }
    .rtmp-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px; color: var(--cyan);
      flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }

    /* Filter button row */
    #filter-row {
      display: flex; gap: 10px;
      margin-bottom: 20px;
      justify-content: center;
    }

    .filter-btn {
      flex: 1; max-width: 160px;
      padding: 12px 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--panel);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      color: var(--txt-mid);
      font-family: 'Inter', sans-serif;
      font-size: 13px; font-weight: 500;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: color .2s, border-color .2s, background .2s, transform .15s;
    }
    .filter-btn:active { transform: scale(.96); }
    .filter-btn:disabled {
      opacity: 0.4; cursor: not-allowed; transform: none;
    }
    .filter-btn.active-filter {
      background: rgba(0,224,255,.10);
      border-color: var(--cyan);
      color: var(--cyan);
    }
    .filter-btn .btn-icon { font-size: 16px; line-height: 1; }

    /* Main controls row — mic, GO LIVE, flip */
    #main-controls {
      display: flex; align-items: center;
      justify-content: center; gap: 18px;
    }

    .side-ctrl {
      width: 50px; height: 50px; border-radius: 50%;
      background: var(--panel);
      border: 1px solid var(--border);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; color: var(--txt-mid);
      transition: color .2s, border-color .2s, transform .15s;
    }
    .side-ctrl:active { transform: scale(.9); }
    .side-ctrl.muted  { color: var(--accent); border-color: rgba(255,45,85,.4); }

    /* ── GO LIVE BUTTON ── */
    #go-live-btn {
      width: 84px; height: 84px; border-radius: 50%;
      background: linear-gradient(145deg, var(--accent) 0%, #b01030 100%);
      border: none; cursor: pointer;
      position: relative;
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 3px;
      transition: transform .15s;
      box-shadow: 0 4px 30px rgba(255,45,85,.55);
      /* Pulse rings */
    }
    #go-live-btn::before,
    #go-live-btn::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      border: 2px solid rgba(255,45,85,.4);
      animation: pulse-ring 2.2s ease-out infinite;
    }
    #go-live-btn::after { animation-delay: 1.1s; }

    @keyframes pulse-ring {
      0%   { width: 84px;  height: 84px;  opacity: .7; }
      100% { width: 150px; height: 150px; opacity: 0;  }
    }

    #go-live-btn.streaming {
      background: linear-gradient(145deg, #1a1c26, #0d0f18);
      border: 2px solid var(--accent);
      box-shadow: 0 0 24px rgba(255,45,85,.35);
    }
    #go-live-btn.streaming::before,
    #go-live-btn.streaming::after { display: none; }

    #go-live-btn:active  { transform: scale(.93); }
    #go-live-btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }

    #go-live-btn .btn-icon-live { pointer-events: none; }
    #go-live-btn .btn-lbl {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px; font-weight: 600;
      color: #fff; letter-spacing: 0.12em;
      text-transform: uppercase; pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- ═══════════════════════════════════
       FULLSCREEN DEEPAR CANVAS HOST
  ═══════════════════════════════════ -->
  <div id="deepar-root"></div>

  <!-- Gradient overlays (cosmetic) -->
  <div class="grad-top"></div>
  <div class="grad-bottom"></div>

  <!-- ═══════════════════════════════════
       INIT / LOADING OVERLAY
       Visible until DeepAR is ready.
  ═══════════════════════════════════ -->
  <div id="init-overlay">
    <div class="brand-name">AURA LIVE</div>
    <div class="spinner"></div>
    <div id="status-text">Requesting camera…</div>
    <div class="progress-track">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
    <button id="grant-btn" onclick="requestCameraAndInit()">Grant Camera Access</button>
  </div>

  <!-- ═══════════════════════════════════
       TOP BAR
  ═══════════════════════════════════ -->
  <div id="top-bar">
    <div class="app-brand">Aura</div>
    <div id="live-badge">LIVE</div>
    <div id="stream-timer">00:00</div>
  </div>

  <!-- Runtime status pill -->
  <div id="runtime-status">Initializing…</div>

  <!-- ═══════════════════════════════════
       BOTTOM CONTROL PANEL
  ═══════════════════════════════════ -->
  <div id="control-panel">

    <!-- RTMP endpoint info (shown while streaming) -->
    <div id="rtmp-info">
      <span class="rtmp-label">RTMP</span>
      <span class="rtmp-value">rtmp://live.aura.io/stream/JOM0PT6S</span>
    </div>

    <!-- Filter buttons -->
    <div id="filter-row">
      <button class="filter-btn active-filter" id="btn-humanoid" onclick="applyHumanoid()" disabled>
        <span class="btn-icon">🤖</span> Apply Humanoid
      </button>
      <button class="filter-btn" id="btn-clear" onclick="clearFilter()" disabled>
        <span class="btn-icon">✕</span> Clear Filter
      </button>
    </div>

    <!-- Mic + GO LIVE + Flip -->
    <div id="main-controls">

      <!-- Mic toggle -->
      <div class="side-ctrl" id="mic-btn" onclick="toggleMic()" title="Toggle microphone">
        <svg id="mic-icon" width="20" height="20" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="23"/>
          <line x1="8" y1="23" x2="16" y2="23"/>
        </svg>
      </div>

      <!-- GO LIVE -->
      <button id="go-live-btn" onclick="toggleStream()" disabled>
        <div class="btn-icon-live" id="live-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="white">
            <path d="M8 5v14l11-7z"/>
          </svg>
        </div>
        <div class="btn-lbl" id="live-lbl">GO LIVE</div>
      </button>

      <!-- Flip camera -->
      <div class="side-ctrl" id="flip-btn" onclick="flipCamera()" title="Flip camera">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="1 4 1 10 7 10"/>
          <polyline points="23 20 23 14 17 14"/>
          <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4-4.64 4.36A9 9 0 0 1 3.51 15"/>
        </svg>
      </div>

    </div>
  </div>

  <!-- ═══════════════════════════════════
       DEEPAR SDK
  ═══════════════════════════════════ -->
  <script src="https://cdn.jsdelivr.net/npm/deepar/dist/deepar.js"></script>

  <script>
  /* ══════════════════════════════════════════════════════════
     CONFIGURATION
  ══════════════════════════════════════════════════════════ */
  const DEEPAR_LICENSE_KEY =
    'B3c5826bcabea8a92afbf4bbd0daef27fea4233f857156feb306e9074a4f6ddbf0368f1f664917c0';

  const DEEPAR_LIB_PATH =
    'https://cdn.jsdelivr.net/npm/deepar/lib/';

  const FACE_TRACKING_MODEL =
    'https://cdn.jsdelivr.net/npm/deepar/models/face/models-6k-v1.bin';

  /* DeepAR CDN effect — "Humanoid" is hosted at this path */
  const EFFECT_HUMANOID =
    'https://cdn.jsdelivr.net/npm/deepar/effects/Humanoid';

  const RTMP_URL  = 'rtmp://live.aura.io/stream/';
  const STREAM_KEY = 'JOM0PT6S';

  /* ══════════════════════════════════════════════════════════
     STATE
  ══════════════════════════════════════════════════════════ */
  let deepAR         = null;   // DeepAR SDK instance
  let liveStream     = null;   // MediaStream from canvas
  let mediaRecorder  = null;   // MediaRecorder used as RTMP placeholder
  let isStreaming    = false;
  let micMuted       = false;
  let facingMode     = 'user';
  let timerInterval  = null;
  let elapsedSeconds = 0;
  let humanoidActive = false;

  /* ══════════════════════════════════════════════════════════
     DOM REFERENCES
  ══════════════════════════════════════════════════════════ */
  const overlay      = document.getElementById('init-overlay');
  const statusText   = document.getElementById('status-text');
  const progressFill = document.getElementById('progress-fill');
  const grantBtn     = document.getElementById('grant-btn');
  const runtimeStatus= document.getElementById('runtime-status');
  const liveBadge    = document.getElementById('live-badge');
  const streamTimer  = document.getElementById('stream-timer');
  const rtmpInfo     = document.getElementById('rtmp-info');
  const goLiveBtn    = document.getElementById('go-live-btn');
  const liveLbl      = document.getElementById('live-lbl');
  const liveIcon     = document.getElementById('live-icon');
  const btnHumanoid  = document.getElementById('btn-humanoid');
  const btnClear     = document.getElementById('btn-clear');
  const micBtn       = document.getElementById('mic-btn');
  const micIcon      = document.getElementById('mic-icon');
  const deeparRoot   = document.getElementById('deepar-root');

  /* ══════════════════════════════════════════════════════════
     STEP 1 — Entry point: request camera, then init DeepAR
  ══════════════════════════════════════════════════════════ */
  async function requestCameraAndInit() {
    grantBtn.style.display = 'none';
    setStatus('Requesting camera permission…', 5);

    try {
      /* Pre-flight getUserMedia to trigger the browser permission dialog.
         DeepAR will open its own stream internally; this just ensures
         the user has already granted access before we start the SDK. */
      const probe = await navigator.mediaDevices.getUserMedia({
        video: { facingMode, width: { ideal: 1280 }, height: { ideal: 720 } },
        audio: true
      });
      probe.getTracks().forEach(t => t.stop()); // release probe stream

      await initDeepAR();

    } catch (err) {
      handleCameraError(err);
    }
  }

  /* ══════════════════════════════════════════════════════════
     STEP 2 — Initialize DeepAR SDK
     We MUST wait for:
       a) DeepAR() constructor promise  → SDK engine ready
       b) downloadFaceTrackingModel()   → face tracking ready
     Only after both are complete do we enable controls.
  ══════════════════════════════════════════════════════════ */
  async function initDeepAR() {
    setStatus('Loading DeepAR engine…', 15);

    try {
      /* ── 2a: Construct DeepAR — awaiting this guarantees the
              WebAssembly engine, shaders, and camera feed are
              fully initialised before we proceed. ── */
      deepAR = await DeepAR({
        licenseKey:  DEEPAR_LICENSE_KEY,
        libPath:     DEEPAR_LIB_PATH,
        /* rootElement: DeepAR creates a <canvas> and appends it here */
        rootElement: deeparRoot,
        additionalOptions: {
          cameraConfig: { facingMode }
        }
      });

      setStatus('DeepAR engine ready. Loading face model…', 40);
      forceCanvasFullscreen(); // make sure canvas fills screen immediately

      /* ── 2b: Download face tracking model — this MUST complete
              before any face filters will work. ── */
      await deepAR.downloadFaceTrackingModel(FACE_TRACKING_MODEL);

      setStatus('Face tracking ready. Applying Humanoid filter…', 75);

      /* ── 2c: Apply default Humanoid filter ── */
      await applyHumanoid();

      setStatus('Ready', 100);

      /* ── 2d: Dismiss loading overlay ── */
      await sleep(400);
      overlay.classList.add('fade-out');
      setTimeout(() => overlay.classList.add('hidden'), 600);

      /* ── 2e: Enable controls ── */
      goLiveBtn.disabled   = false;
      btnHumanoid.disabled = false;
      btnClear.disabled    = false;

      setRuntimeStatus('● Ready');

    } catch (err) {
      console.error('[DeepAR init error]', err);
      setStatus(`Error: ${err.message || 'DeepAR failed to load'}`, 0);
      grantBtn.textContent = 'Retry';
      grantBtn.style.display = 'block';
    }
  }

  /* ══════════════════════════════════════════════════════════
     FORCE CANVAS FULLSCREEN
     DeepAR appends a canvas to rootElement. We watch for it
     via MutationObserver and force fullscreen styles.
  ══════════════════════════════════════════════════════════ */
  function forceCanvasFullscreen() {
    function applyStyles() {
      deeparRoot.querySelectorAll('canvas').forEach(c => {
        c.style.cssText =
          'position:absolute!important;inset:0!important;' +
          'width:100%!important;height:100%!important;' +
          'object-fit:cover!important;display:block!important;';
      });
    }
    applyStyles(); // immediate attempt
    const obs = new MutationObserver(applyStyles);
    obs.observe(deeparRoot, { childList: true, subtree: true });
    window.addEventListener('resize', applyStyles);
  }

  /* ══════════════════════════════════════════════════════════
     APPLY HUMANOID FILTER
  ══════════════════════════════════════════════════════════ */
  async function applyHumanoid() {
    if (!deepAR) return;
    btnHumanoid.disabled = true;
    setRuntimeStatus('Applying Humanoid filter…');

    try {
      await deepAR.switchEffect(EFFECT_HUMANOID);
      humanoidActive = true;
      btnHumanoid.classList.add('active-filter');
      btnClear.classList.remove('active-filter');
      setRuntimeStatus('● Humanoid filter active');
    } catch (err) {
      console.error('[Effect error]', err);
      setRuntimeStatus('⚠ Filter load failed');
    } finally {
      btnHumanoid.disabled = false;
    }
  }

  /* ══════════════════════════════════════════════════════════
     CLEAR FILTER
  ══════════════════════════════════════════════════════════ */
  async function clearFilter() {
    if (!deepAR) return;
    btnClear.disabled = true;
    setRuntimeStatus('Clearing filter…');

    try {
      await deepAR.clearEffect();
      humanoidActive = false;
      btnHumanoid.classList.remove('active-filter');
      btnClear.classList.add('active-filter');
      setRuntimeStatus('● No filter');
    } catch (err) {
      console.error('[Clear effect error]', err);
    } finally {
      btnClear.disabled = false;
    }
  }

  /* ══════════════════════════════════════════════════════════
     GO LIVE / END STREAM
  ══════════════════════════════════════════════════════════ */
  function toggleStream() {
    isStreaming ? endStream() : startStream();
  }

  function startStream() {
    /* Grab the MediaStream from the DeepAR canvas so the
       FILTERED video is what gets captured / streamed. */
    const canvas = deeparRoot.querySelector('canvas');
    if (!canvas) {
      alert('DeepAR canvas not found. Please wait for initialization.');
      return;
    }

    try {
      /* captureStream(fps) → filtered video MediaStream */
      const videoStream = canvas.captureStream(30);

      /* Attach audio track if available */
      navigator.mediaDevices.getUserMedia({ audio: true })
        .then(audioStream => {
          audioStream.getAudioTracks().forEach(t => videoStream.addTrack(t));
          liveStream = videoStream;
          if (micMuted) liveStream.getAudioTracks().forEach(t => t.enabled = false);
        })
        .catch(() => { liveStream = videoStream; });

      liveStream = videoStream;

      /* ── RTMP Simulation via MediaRecorder ──────────────────
         Pure client-side JS cannot push RTMP directly.
         In production, you'd:
           1. Send chunks via WebSocket to a Node.js relay server
           2. That server pipes to an ffmpeg process which pushes RTMP
         Here we use MediaRecorder to demonstrate the data pipeline.
         In a real implementation, replace onDataAvailable with:
           ws.send(event.data);  // WebSocket to relay
      ──────────────────────────────────────────────────────── */
      const mimeType = getSupportedMimeType();
      mediaRecorder = new MediaRecorder(videoStream, mimeType ? { mimeType } : {});

      mediaRecorder.ondataavailable = (event) => {
        if (event.data && event.data.size > 0) {
          /* ══ RTMP HOOK ══
             This is where stream data would be sent to:
             rtmp://live.aura.io/stream/JOM0PT6S
             
             In production:
             ws.send(event.data);
          */
          console.log(`[RTMP] → ${RTMP_URL}${STREAM_KEY} | chunk: ${event.data.size} bytes`);
        }
      };

      mediaRecorder.start(1000); // chunk every 1 second

    } catch (err) {
      console.error('[captureStream error]', err);
      alert('Could not capture camera stream: ' + err.message);
      return;
    }

    /* ── UI: Go Live state ── */
    isStreaming = true;
    goLiveBtn.classList.add('streaming');
    liveIcon.innerHTML = `
      <svg width="22" height="22" viewBox="0 0 24 24" fill="#ff2d55">
        <rect x="6" y="4" width="4" height="16"/>
        <rect x="14" y="4" width="4" height="16"/>
      </svg>`;
    liveLbl.textContent = 'END';

    liveBadge.classList.add('visible');
    streamTimer.classList.add('visible');
    rtmpInfo.classList.add('visible');

    elapsedSeconds = 0;
    timerInterval = setInterval(() => {
      elapsedSeconds++;
      streamTimer.textContent = formatTime(elapsedSeconds);
    }, 1000);

    setRuntimeStatus(`🔴 LIVE → ${RTMP_URL}${STREAM_KEY}`);
    console.log(`[Stream] Started → ${RTMP_URL}${STREAM_KEY}`);
  }

  function endStream() {
    if (mediaRecorder && mediaRecorder.state !== 'inactive') {
      mediaRecorder.stop();
    }
    if (liveStream) {
      /* Do NOT stop the camera tracks — DeepAR manages those.
         Only stop any audio tracks we added. */
      liveStream.getAudioTracks().forEach(t => t.stop());
      liveStream = null;
    }

    clearInterval(timerInterval);
    isStreaming = false;

    goLiveBtn.classList.remove('streaming');
    liveIcon.innerHTML = `
      <svg width="24" height="24" viewBox="0 0 24 24" fill="white">
        <path d="M8 5v14l11-7z"/>
      </svg>`;
    liveLbl.textContent = 'GO LIVE';

    liveBadge.classList.remove('visible');
    streamTimer.classList.remove('visible');
    rtmpInfo.classList.remove('visible');

    setRuntimeStatus(`● Stream ended — ${formatTime(elapsedSeconds)} on air`);
    console.log(`[Stream] Ended. Duration: ${formatTime(elapsedSeconds)}`);
  }

  /* ══════════════════════════════════════════════════════════
     FLIP CAMERA
  ══════════════════════════════════════════════════════════ */
  async function flipCamera() {
    if (!deepAR) return;
    facingMode = facingMode === 'user' ? 'environment' : 'user';

    try {
      await deepAR.switchCamera(facingMode);
      setRuntimeStatus(facingMode === 'user' ? '● Front camera' : '● Back camera');
    } catch (err) {
      console.warn('[Flip camera error]', err);
      facingMode = facingMode === 'user' ? 'environment' : 'user'; // revert
      setRuntimeStatus('⚠ Camera switch failed');
    }
  }

  /* ══════════════════════════════════════════════════════════
     TOGGLE MIC
  ══════════════════════════════════════════════════════════ */
  function toggleMic() {
    micMuted = !micMuted;

    if (liveStream) {
      liveStream.getAudioTracks().forEach(t => { t.enabled = !micMuted; });
    }

    micBtn.classList.toggle('muted', micMuted);
    micIcon.innerHTML = micMuted ? MIC_OFF_SVG : MIC_ON_SVG;
    setRuntimeStatus(micMuted ? '🔇 Mic muted' : '🎙 Mic on');
  }

  const MIC_ON_SVG = `
    <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
    <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
    <line x1="12" y1="19" x2="12" y2="23"/>
    <line x1="8" y1="23" x2="16" y2="23"/>`;

  const MIC_OFF_SVG = `
    <line x1="1" y1="1" x2="23" y2="23"/>
    <path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V4a3 3 0 0 0-5.94-.6"/>
    <path d="M17 16.95A7 7 0 0 1 5 12v-2m14 0v2a7 7 0 0 1-.11 1.23"/>
    <line x1="12" y1="19" x2="12" y2="23"/>
    <line x1="8" y1="23" x2="16" y2="23"/>`;

  /* ══════════════════════════════════════════════════════════
     ERROR HANDLING
  ══════════════════════════════════════════════════════════ */
  function handleCameraError(err) {
    console.error('[Camera error]', err);
    let msg;
    switch (err.name) {
      case 'NotAllowedError':
        msg = 'Camera permission denied.\nPlease allow camera access in your browser settings.';
        break;
      case 'NotFoundError':
        msg = 'No camera found on this device.';
        break;
      case 'NotReadableError':
        msg = 'Camera is in use by another app.';
        break;
      default:
        msg = `Camera error: ${err.message}`;
    }
    setStatus(msg, 0);
    grantBtn.textContent = 'Try Again';
    grantBtn.style.display = 'block';
  }

  /* ══════════════════════════════════════════════════════════
     HELPERS
  ══════════════════════════════════════════════════════════ */
  function setStatus(msg, progress) {
    statusText.textContent = msg;
    if (progress !== undefined) {
      progressFill.style.width = progress + '%';
    }
  }

  function setRuntimeStatus(msg) {
    runtimeStatus.textContent = msg;
  }

  function formatTime(s) {
    const m = String(Math.floor(s / 60)).padStart(2, '0');
    const sec = String(s % 60).padStart(2, '0');
    return `${m}:${sec}`;
  }

  function sleep(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
  }

  function getSupportedMimeType() {
    const types = [
      'video/webm;codecs=vp9',
      'video/webm;codecs=vp8',
      'video/webm',
    ];
    return types.find(t => MediaRecorder.isTypeSupported(t)) || '';
  }

  /* ══════════════════════════════════════════════════════════
     WAKE LOCK — prevent screen sleep during live streams
  ══════════════════════════════════════════════════════════ */
  let wakeLock = null;
  async function requestWakeLock() {
    if ('wakeLock' in navigator) {
      try { wakeLock = await navigator.wakeLock.request('screen'); }
      catch (_) {}
    }
  }
  requestWakeLock();
  document.addEventListener('visibilitychange', () => {
    if (wakeLock !== null && document.visibilityState === 'visible') requestWakeLock();
  });

  /* ══════════════════════════════════════════════════════════
     AUTO-START
     Check if camera permission is already granted, then
     skip the permission prompt entirely.
  ══════════════════════════════════════════════════════════ */
  (async () => {
    try {
      const perm = await navigator.permissions.query({ name: 'camera' });
      if (perm.state === 'granted') {
        /* Permission already granted — start immediately */
        await requestCameraAndInit();
      } else {
        /* Show the grant button */
        setStatus('Camera permission required.');
        grantBtn.style.display = 'block';
      }
    } catch (_) {
      /* permissions API not available (e.g. Safari) — show button */
      setStatus('Tap below to enable camera.');
      grantBtn.style.display = 'block';
    }
  })();
  </script>
</body>
